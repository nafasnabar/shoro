@keyframes rise-block {
  from {
    opacity: 0;
    transform: translateY(36px);
  }
  to {
    opacity: 1;
    transform: none;
  }
}
@keyframes word-up {
  from {
    transform: translateY(115%);
  }
  to {
    transform: none;
  }
}
@keyframes ink-word {
  from {
    opacity: 0.14;
  }
  to {
    opacity: 1;
  }
}
@keyframes scene-in {
  from {
    scale: 1.16;
    opacity: 0;
  }
  to {
    scale: 1;
    opacity: 1;
  }
}
@keyframes camera-push {
  from {
    scale: 1;
  }
  to {
    scale: 1.06;
  }
}
@keyframes hero-sink {
  to {
    transform: translate3d(0, 16%, 0);
  }
}
@keyframes hero-lift {
  to {
    opacity: 0;
    transform: translate3d(0, -56px, 0);
  }
}
@keyframes bloom {
  0%, 100% {
    opacity: 0.75;
    scale: 1;
  }
  50% {
    opacity: 1;
    scale: 1.12;
  }
}
@keyframes core {
  0%, 100% {
    scale: 1;
  }
  50% {
    scale: 1.25;
  }
}
@keyframes twinkle {
  0%, 100% {
    opacity: 0.15;
    scale: 0.6;
  }
  50% {
    opacity: 1;
    scale: 1;
  }
}
@keyframes shoot {
  0% {
    opacity: 0;
    translate: 0 0;
  }
  1% {
    opacity: 1;
  }
  7% {
    opacity: 0;
    translate: -360px 168px;
  }
  100% {
    opacity: 0;
    translate: -360px 168px;
  }
}
@keyframes draw-y {
  from {
    transform: scaleY(0);
  }
  to {
    transform: scaleY(1);
  }
}
@keyframes grow-x {
  from {
    transform: scaleX(0);
  }
  to {
    transform: scaleX(1);
  }
}
@keyframes bar-in {
  from {
    scale: 1 0;
  }
  to {
    scale: 1 1;
  }
}
@keyframes wave {
  0%, 100% {
    transform: scaleY(0.4);
  }
  50% {
    transform: scaleY(1);
  }
}
@keyframes footer-rise {
  from {
    transform: translateY(35%);
    opacity: 0;
  }
  to {
    transform: none;
    opacity: 1;
  }
}
@keyframes scroll-cue {
  from {
    transform: translateY(-100%);
  }
  to {
    transform: translateY(200%);
  }
}
.scroll-cue {
  animation: scroll-cue 2.2s ease-in-out infinite;
}
@keyframes spark {
  from {
    opacity: 0;
    scale: 0;
  }
  to {
    opacity: 1;
    scale: 1;
  }
}
@keyframes flare {
  from {
    opacity: 0;
    scale: 0.15;
  }
  to {
    opacity: 1;
    scale: 1;
  }
}
@keyframes fade-out {
  to {
    opacity: 0;
  }
}
@keyframes center-out {
  to {
    opacity: 0;
    scale: 1.35;
  }
}
@keyframes bar-top-out {
  to {
    transform: translateY(-100%);
  }
}
@keyframes bar-bottom-out {
  to {
    transform: translateY(100%);
  }
}
@keyframes vt-in {
  from {
    opacity: 0;
    transform: translateY(16px);
  }
}
